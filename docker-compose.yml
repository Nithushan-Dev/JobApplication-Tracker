services:
  db:
    image: mysql:9.7.1
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jobtracker
      MYSQL_USER: jobuser
      MYSQL_PASSWORD: jobpass
    ports:
      - "3307:3306"


  app:
      build: .
      ports:
        - "8080:8080"
      environment:
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
      depends_on:
        - db